name: Bot

# Répond aux élèves : à la fin de chaque exécution de leur workflow « CI »,
# et au push quand la CI ne peut pas répondre (pas encore de workflow, workflow illisible,
# commit de documentation seule).
on:
  push:
    branches-ignore: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: bot-${{ github.event.workflow_run.head_branch || github.ref_name }}
  cancel-in-progress: false

jobs:
  bot:
    name: Bot intégration continue
    if: >-
      (github.event_name == 'push' && github.event.deleted == false && github.actor != github.repository_owner) ||
      (github.event_name == 'workflow_run' && github.event.workflow_run.actor.login != github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - run: git fetch --force origin '+refs/heads/*:refs/remotes/origin/*'
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - name: Installer le bot
        run: npm ci --prefix .github/bot --no-audit --no-fund
      - name: Vérifier les missions
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          EVENEMENT: ${{ github.event_name }}
          ACTEUR: ${{ github.event.workflow_run.actor.login || github.actor }}
          BRANCHE: ${{ github.event.workflow_run.head_branch || github.ref_name }}
          SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
          AVANT: ${{ github.event.before }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          SORTIE: ${{ runner.temp }}/resultat.json
        run: |
          # Laisser à GitHub le temps d'enregistrer une éventuelle exécution du commit poussé
          if [ "$EVENEMENT" = "push" ]; then sleep 15; fi
          node .github/bot/bot.js
      - name: Répondre à l'élève
        env:
          GH_TOKEN: ${{ github.token }}
          RES: ${{ runner.temp }}/resultat.json
          REPO: ${{ github.repository }}
        run: |
          node -e "const r=require(process.env.RES);if(r.commentaire)require('fs').writeFileSync('corps.json',JSON.stringify({body:r.commentaire}));require('fs').writeFileSync('sha.txt',r.sha||'')"
          if [ -f corps.json ]; then
            gh api -X POST "repos/$REPO/commits/$(cat sha.txt)/comments" --input corps.json > /dev/null
            echo "Réponse envoyée en commentaire sur le commit." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Pas de réponse pour cet événement." >> "$GITHUB_STEP_SUMMARY"
          fi
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm Bot
      - run: npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm Bot
      - run: npm test
