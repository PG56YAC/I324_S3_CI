name: CI

on:
  push:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses : actions/checkout@v7
      - uses : actions/setup-node@v7
        with:
          node-version: lts/*
      - run : npm ci
      - run : npm run lint

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run : npm ci
      - run : npm test

  paquet:
    needs: [ lint, tests ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
      - run: npm ci
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: paquet
          path: "*.tgz"
          if-no-files-found: error