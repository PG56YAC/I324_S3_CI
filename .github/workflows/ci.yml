
name: CI

on:
  push:

jobs:
  lint:
    name: Vérifier le lint
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le lint
        run: npm run lint

  tests:
    name: Exécuter les tests
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Installer les dépendances
        run: npm ci

      - name: Exécuter les tests
        run: npm test
